# ============================================================================
# Series A: Scale Sweep — 6 configs (NanoSeek-1B is held-out validation)
# ============================================================================
# Purpose: Fit L(N_active, D, E) power law across 60× range in N_active.
# All configs hold sparsity ratio κ=top_k/E constant at 12.5%.
# Depth is monotonically non-decreasing: 4→8→10→14→16→16.
#
# muP note: All HPs are muP-scaled from anchor (width=480).
#   matrix_lr_scaled = anchor_best_mlr × (480 / hidden_size)
#   embedding_lr = anchor_best_elr  (constant)
#   batch_scaling = √(global_batch_tokens / anchor_batch_tokens)
#
# DeepSeek V3.2 ratios preserved at all scales:
#   moe_inter ≈ 0.375 × hidden
#   q_lora ≈ 0.21 × hidden
#   kv_lora ≈ 0.07 × hidden
#   qk_nope=128, qk_rope=64, v_head=128 (family constants)
# ============================================================================

configs:
  nano_20M:
    hidden_size: 256
    num_layers: 4
    num_heads: 2              # 256/128=2
    intermediate_size: 655    # 2.56 × 256
    total_tokens: 400_000_000
    global_batch_size: 32
    sequence_length: 4096
    moe:
      n_routed_experts: 16
      num_experts_per_tok: 2
      n_group: 4
      topk_group: 2
      moe_intermediate_size: 128  # 0.375 × 256 ≈ 96 → round up for SwiGLU
      first_k_dense_replace: 1
    mla:
      q_lora_rank: 56         # 0.21 × 256 ≈ 54 → 56
      kv_lora_rank: 24        # 0.07 × 256 ≈ 18 → 24
    mtp:
      mtp_num_heads: 2
    run_name: "scaling-a-nano-20M"

  nano_80M:
    hidden_size: 512
    num_layers: 8
    num_heads: 4              # 512/128=4
    intermediate_size: 1311   # 2.56 × 512
    total_tokens: 1_500_000_000
    global_batch_size: 48
    sequence_length: 4096
    moe:
      n_routed_experts: 32
      num_experts_per_tok: 4
      n_group: 4
      topk_group: 2
      moe_intermediate_size: 192
      first_k_dense_replace: 1
    mla:
      q_lora_rank: 112
      kv_lora_rank: 40
    mtp:
      mtp_num_heads: 4
    run_name: "scaling-a-nano-80M"

  nano_150M:
    hidden_size: 768
    num_layers: 10
    num_heads: 6              # 768/128=6
    intermediate_size: 1966   # 2.56 × 768
    total_tokens: 2_800_000_000
    global_batch_size: 64
    sequence_length: 4096
    moe:
      n_routed_experts: 32
      num_experts_per_tok: 4
      n_group: 4
      topk_group: 2
      moe_intermediate_size: 288
      first_k_dense_replace: 1
    mla:
      q_lora_rank: 160
      kv_lora_rank: 56
    mtp:
      mtp_num_heads: 6
    run_name: "scaling-a-nano-150M"

  nano_300M:
    hidden_size: 1024
    num_layers: 14
    num_heads: 8              # 1024/128=8
    intermediate_size: 2621   # 2.56 × 1024
    total_tokens: 5_600_000_000
    global_batch_size: 96
    sequence_length: 4096
    moe:
      n_routed_experts: 64
      num_experts_per_tok: 8
      n_group: 8
      topk_group: 4
      moe_intermediate_size: 384
      first_k_dense_replace: 2
    mla:
      q_lora_rank: 216
      kv_lora_rank: 72
    mtp:
      mtp_num_heads: 8
    run_name: "scaling-a-nano-300M"

  nano_500M:
    hidden_size: 1280
    num_layers: 16
    num_heads: 10             # 1280/128=10
    intermediate_size: 3277   # 2.56 × 1280
    total_tokens: 8_800_000_000
    global_batch_size: 96
    sequence_length: 4096
    moe:
      n_routed_experts: 64
      num_experts_per_tok: 8
      n_group: 8
      topk_group: 4
      moe_intermediate_size: 480
      first_k_dense_replace: 2
    mla:
      q_lora_rank: 272
      kv_lora_rank: 96
    mtp:
      mtp_num_heads: 10
    run_name: "scaling-a-nano-500M"

  nano_800M:
    hidden_size: 1664
    num_layers: 16
    num_heads: 13             # 1664/128=13
    intermediate_size: 4260   # 2.56 × 1664
    total_tokens: 15_200_000_000
    global_batch_size: 128
    sequence_length: 4096
    moe:
      n_routed_experts: 64
      num_experts_per_tok: 8
      n_group: 8
      topk_group: 4
      moe_intermediate_size: 624
      first_k_dense_replace: 2
