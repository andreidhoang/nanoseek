# ============================================================================
# Series C: IsoFLOP Sweep — 5 configs
# ============================================================================
# Purpose: Find Chinchilla-optimal N_active/D allocation at fixed compute.
# C_scaling ≈ 9e18 FLOPs (using C = 6 × N_active × D).
# Vary N_active from 30M to 600M, adjust D to hold C constant.
#
# The minimum of the IsoFLOP curve gives the compute-optimal point.
# If minimum is at N_active/D ≈ 0.015, Chinchilla ratio holds for MoE.
# If shifted right (higher N_active), MoE models are undertrained.
#
# Pre-registered hypothesis:
#   Optimal ratio near N_active/D ≈ 0.015-0.03 (20-70× Chinchilla for dense).
#   This is likely shifted from Chinchilla's 1:20 for dense models because
#   MoE expert specialization benefits from more data.
# ============================================================================

configs:
  isoflop_very_data:
    # C = 6 × 30M × 50B = 9.0e18
    hidden_size: 320
    num_layers: 4
    num_heads: 2              # 320/128 ≈ 2.5 → 2
    intermediate_size: 819
    total_tokens: 50_000_000_000
    global_batch_size: 32
    sequence_length: 4096
    moe:
      n_routed_experts: 16
      num_experts_per_tok: 2
      n_group: 4
      topk_group: 2
      moe_intermediate_size: 120
      first_k_dense_replace: 1
    mla:
      q_lora_rank: 68
      kv_lora_rank: 24
    mtp:
      mtp_num_heads: 2
    run_name: "scaling-c-very-data"

  isoflop_data_heavy:
    # C = 6 × 50M × 30B = 9.0e18
    hidden_size: 384
    num_layers: 6
    num_heads: 3
    intermediate_size: 983
    total_tokens: 30_000_000_000
    global_batch_size: 32
    sequence_length: 4096
    moe:
      n_routed_experts: 16
      num_experts_per_tok: 2
      n_group: 4
      topk_group: 2
      moe_intermediate_size: 144
      first_k_dense_replace: 1
    mla:
      q_lora_rank: 80
      kv_lora_rank: 28
    mtp:
      mtp_num_heads: 3
    run_name: "scaling-c-data-heavy"

  isoflop_balanced:
    # C = 6 × 150M × 10B = 9.0e18
    hidden_size: 768
    num_layers: 10
    num_heads: 6
    intermediate_size: 1966
    total_tokens: 10_000_000_000
    global_batch_size: 64
    sequence_length: 4096
    moe:
      n_routed_experts: 32
      num_experts_per_tok: 4
      n_group: 4
      topk_group: 2
      moe_intermediate_size: 288
      first_k_dense_replace: 1
    mla:
      q_lora_rank: 160
      kv_lora_rank: 56
    mtp:
      mtp_num_heads: 6
    run_name: "scaling-c-balanced"

  isoflop_param_heavy:
    # C = 6 × 400M × 3.75B = 9.0e18
    hidden_size: 1280
    num_layers: 16
    num_heads: 10
    intermediate_size: 3277
    total_tokens: 3_750_000_000
    global_batch_size: 96
    sequence_length: 4096
    moe:
      n_routed_experts: 64
      num_experts_per_tok: 8
      n_group: 8
      topk_group: 4
      moe_intermediate_size: 480
      first_k_dense_replace: 2
    mla:
      q_lora_rank: 272
      kv_lora_rank: 96
    mtp:
      mtp_num_heads: 10
    run_name: "scaling-c-param-heavy"

  isoflop_very_param:
    # C = 6 × 600M × 2.5B = 9.0e18
    hidden_size: 1536
    num_layers: 16
    num_heads: 12
    intermediate_size: 3932
    total_tokens: 2_500_000_000
    global_batch_size: 128
    sequence_length: 4096
    moe:
      n_routed_experts: 64
      num_experts_per_tok: 8
      n_group: 8
      topk_group: 4
      moe_intermediate_size: 576
      first_k_dense_replace: 2
    mla:
      q_lora_rank: 324
      kv_lora_rank: 108
    mtp:
      mtp_num_heads: 12
    run_name: "scaling-c-very-param"
