# nano-500M muP Transfer Validation
# 1 run × ~14 hrs on 1× H100 = ~$46
# Uses muP-scaled HPs from best anchor grid search run
# Pre-registered: ema_val_bpb within 0.02 of 500M grid-searched optimum

scale: 500m
seed: 42
eval_every: 500
save_every: 2000

# These values are PLACEHOLDERS — replace with best anchor HP after grid search
# muP auto-scales: η_hidden = η_ref × √(B/B_ref) × (w_ref/w)
matrix_lr: 0.02       # <-- UPDATE from hp-r1/r2 grid best
embedding_lr: 0.3     # <-- UPDATE from hp-r1/r2 grid best
