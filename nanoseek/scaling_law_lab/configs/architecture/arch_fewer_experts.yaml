# ============================================================================
# Architecture Ablation: Fewer Experts (16 experts, top-2)
# ============================================================================
# Reduces from 64 experts/top-8 to 16 experts/top-2.
# Preserves same N_active (same number of expert params fire per token).
# Tests the granularity hypothesis from Krajewski et al.
#
# Key change: κ = 2/16 = 12.5% (same sparsity ratio)
# But expert granularity G drops: fewer, larger experts.
#
# Pre-registered hypothesis:
#   Loss increases by ~0.03 BPB.
#   Granularity effect from log(E) term in MoE scaling law.
#   16 experts can't specialize as finely as 64.
#
# Launch:
#   python -m nanoseek.scripts.pre_train \
#       --run "arch-fewer-experts" \
#       --scale anchor \
#       --num-experts 16 --top-k 2 --n-group 4 --topk-group 2 \
#       --seed 42
# ============================================================================

moe:
  n_routed_experts: 16
  num_experts_per_tok: 2
  n_group: 4
  topk_group: 2
  # Expert intermediate size scales up to match total active params:
  # Original: 8 experts × 180 inter = 1440 total active expert width
  # New: 2 experts × 720 inter = 1440 total active expert width
  moe_intermediate_size: 720
