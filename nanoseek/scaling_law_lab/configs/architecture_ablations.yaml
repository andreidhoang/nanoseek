# Architecture Sensitivity Ablations at Anchor Scale
# 4 runs × ~13 min each = ~52 min
# Control: stab-A-baseline (full V3.2 config)

scale: anchor
seed: 42
eval_every: 50

runs:
  arch-no-mtp:
    # MTP disabled (lambda=0)
    # Hypothesis: loss increases ~0.05 BPB
    flags: [--no-mtp]

  arch-no-shared:
    # Shared experts removed
    # Hypothesis: loss increases ~0.02-0.04 BPB
    flags: [--no-shared-experts]

  arch-no-mla:
    # Standard MHA instead of MLA
    # NOTE: requires MHA fallback in model.py (not yet implemented)
    # Hypothesis: loss approximately equal at 4K context
    flags: []  # TODO: add --no-mla flag when MHA fallback exists

  arch-fewer-experts:
    # 16 experts, top-2 (same N_active fraction: 2/16 = 12.5%)
    # Hypothesis: loss increases ~0.03 BPB (granularity effect)
    flags: [--num-experts, "16", --top-k, "2", --n-group, "4", --topk-group, "2"]
