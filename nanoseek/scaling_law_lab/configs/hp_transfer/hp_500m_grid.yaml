# ============================================================================
# HP Grid Search — 500M Scale (4 runs, backup if muP transfer fails)
# ============================================================================
# Purpose: If muP transfer hypothesis fails, find local optimum at 500M.
# Only run this if hp-500m-transfer is >0.02 BPB worse than expected.
#
# Launch:
#   for mlr in 0.004 0.0075 0.015 0.03; do
#     python -m nanoseek.scripts.pre_train \
#         --run "hp-500m-grid-mlr${mlr}" \
#         --scale 500m \
#         --matrix-lr $mlr \
#         --eval-every 500 \
#         --save-every -1 \
#         --seed 42
#   done
# ============================================================================

scale: 500m
seed: 42
eval_every: 500
save_every: -1

grid:
  # Centered around muP-predicted value: anchor_best × (480/1280) ≈ anchor_best × 0.375
  # For anchor_best=0.02: 0.02 × 0.375 = 0.0075
  matrix_lr: [0.004, 0.0075, 0.015, 0.03]
