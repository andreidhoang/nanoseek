# HP Grid Search at Anchor Scale (~55M active)
# 4-round strategy: coarse → fine → multi-seed → weight decay
# Total: 12 + 9 + 9 + 2 = 32 runs, ~8.5 hrs, ~$28
# Pre-registered: best HP here should transfer via muP to 500M within 0.02 BPB

scale: anchor
eval_every: 100
save_every: -1  # no checkpoints for grid search (save GPU time + disk)

# ═══════════════════════════════════════════════════════════════
# Round 1: Coarse grid (12 runs, seed=42, ~2.6 hrs, ~$8.55)
# ═══════════════════════════════════════════════════════════════
# matrix_lr range [0.005, 0.04]:
#   Muon uses Newton-style updates → typical LR 0.01-0.05 (higher than AdamW).
#   8× range (0.005→0.04) covers ±2× around expected sweet spot.
#   Geometric 2× spacing: 4 points capture the right order of magnitude.
#
# embedding_lr range [0.1, 0.5]:
#   Embeddings are a lookup table (no matrix multiply) → need aggressive LR.
#   This is well-known from muP literature (Yang et al., 2022).
#   3 points span the typical range for Muon+embedding combos.
round1:
  seed: 42
  grid:
    matrix_lr: [0.005, 0.01, 0.02, 0.04]
    embedding_lr: [0.1, 0.3, 0.5]
  # Run name pattern: hp-r1-mlr{mlr}-elr{elr}

# ═══════════════════════════════════════════════════════════════
# Round 2: Fine grid around Round 1 winner (9 runs, seed=42, ~2 hrs)
# ═══════════════════════════════════════════════════════════════
# Why: Round 1's 2× jumps are coarse. The actual optimum likely lies
# between grid points. Round 2 zooms ±25% around the winner with
# 3×3 grid (1.25× spacing → finds optimum within ~12%).
round2:
  seed: 42
  strategy: "±25% around Round 1 winner"
  multipliers: [0.75, 1.0, 1.25]
  # Requires: BEST_MLR, BEST_ELR from Round 1 analysis
  # Run name pattern: hp-r2-mlr{mlr}-elr{elr}

# ═══════════════════════════════════════════════════════════════
# Round 3: Multi-seed validation (9 runs = 3 configs × 3 seeds, ~2 hrs)
# ═══════════════════════════════════════════════════════════════
# Why: With 1 seed, a 0.02 BPB difference could be noise. 3 seeds
# gives mean ± std, enabling statistical comparison. If std > diff
# between top configs, they're effectively tied (pick simpler one).
# Seeds chosen to be: default (42), prime (137), year (2024) — arbitrary
# but fixed pre-registration.
round3_seeds:
  seeds: [42, 137, 2024]
  configs: 3  # top-3 from Round 1+2 combined
  # Requires: TOP3_CONFIGS from Round 2 analysis
  # Run name pattern: hp-seed-mlr{mlr}-elr{elr}-s{seed}

# ═══════════════════════════════════════════════════════════════
# Round 4: Weight decay sensitivity (2 runs, ~26 min)
# ═══════════════════════════════════════════════════════════════
# Why: Muon's Newton-style updates interact non-trivially with WD.
# Default WD=0.1 may not be optimal. Test WD=0.0 (no regularization)
# and WD=0.3 (stronger) against the confirmed winner.
# Compare to hp-seed-*-s42 which uses WD=0.1 as implicit baseline.
round4_wd:
  seed: 42
  weight_decay_values: [0.0, 0.3]
  # Baseline: WD=0.1 from Round 3 seed=42 run
  # Run name pattern: hp-wd-mlr{mlr}-elr{elr}-wd{wd}

# ═══════════════════════════════════════════════════════════════
# Fixed parameters (not swept in any round)
# ═══════════════════════════════════════════════════════════════
unembedding_lr: 0.008
router_lr: 0.0003
norm_lr: 0.0003
weight_decay: 0.1  # default; overridden in Round 4

# ═══════════════════════════════════════════════════════════════
# Decision procedure (pre-registered)
# ═══════════════════════════════════════════════════════════════
# 1. Round 1: Pick top-3 by final ema_val_bpb
# 2. Round 2: Pick top-3 from R1∪R2 combined by final ema_val_bpb
# 3. Round 3: Rank by mean(ema_val_bpb) across 3 seeds.
#    If top-2 configs have overlapping std ranges → pick the one with
#    lower matrix_lr (more conservative = safer for scale transfer).
# 4. Round 4: If WD≠0.1 improves mean BPB by >1 std of the seed runs,
#    adopt it. Otherwise keep WD=0.1 (Occam's razor).
# 5. Final winner → used for 500m-transfer and NanoSeek-1B.
