# ============================================================================
# RunPod Pod Templates for NanoSeek Phase 3
# ============================================================================
#
# These are NOT machine-readable configs — RunPod doesn't accept YAML templates.
# This is a REFERENCE for manual pod creation in the RunPod UI.
#
# Go to: https://runpod.io/console/pods → Deploy → GPU Cloud
#
# IMPORTANT: Create a Network Volume FIRST (in same region as your pods)
# so data persists across pod restarts/terminations.
#
# ============================================================================

# ── Shared environment variables (set in all templates) ──
shared_env: &shared_env
  WANDB_API_KEY: "<your-key>"
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
  NANOCHAT_BASE_DIR: "/workspace/data"    # data on network volume
  WANDB_PROJECT: "nanoseek"

# ── Network Volume ──
# Create ONCE, reuse across all pods:
#   Name: nanoseek-data
#   Region: US-TX-3 (or wherever H100s are cheapest)
#   Size: 200 GB (enough for data + all checkpoints)
network_volume:
  name: "nanoseek-data"
  size_gb: 200
  mount_path: "/workspace"

# ============================================================================
# Pod 1: Anchor Ablations (Day 1)
# ============================================================================
# Cost: ~$3-5 for ~4 hours
# What runs: Gate 1, HP grid (12), stability (5), architecture (3) = 21 runs

pod1_anchor:
  name: "nanoseek-day1-anchor"
  gpu_type: "NVIDIA RTX 4090"        # 24GB, 330 TFLOPS bf16, ~$0.44/hr — best value
  gpu_count: 1                        # Anchor model is ~4.2 GB, fits easily in 24 GB
  cloud_type: "COMMUNITY"            # cheapest tier — ok for short runs
  container_image: "runpod/pytorch:2.4.0-py3.11-cuda12.4.1-devel-ubuntu22.04"
  volume_id: "<nanoseek-data-volume-id>"
  env: *shared_env

  # After pod starts, SSH in and run:
  #   bash /workspace/nanoseek/nanoseek/scaling_law_lab/setup_runpod.sh --full --num-shards 170
  #   cd /workspace/nanoseek/nanoseek
  #   python -m nanoseek.scripts.run_phase3 --stop-after day1

  # Alternative: use tmux so you can disconnect
  #   tmux new -s train
  #   python -m nanoseek.scripts.run_phase3 --stop-after day1
  #   # Ctrl+B, D to detach; tmux attach -t train to reattach

# ============================================================================
# Pod 2: 500M Validation (Day 2)
# ============================================================================
# Cost: ~$46 for ~14 hours
# What runs: 500M transfer (1 run), optionally 500M grid (4 runs) if muP fails

pod2_500m:
  name: "nanoseek-day2-500m"
  gpu_type: "NVIDIA H100 80GB HBM3"
  gpu_count: 1
  cloud_type: "SECURE"               # better reliability for 14hr run
  container_image: "runpod/pytorch:2.4.0-py3.11-cuda12.4.1-devel-ubuntu22.04"
  volume_id: "<nanoseek-data-volume-id>"    # SAME volume as Pod 1
  env: *shared_env

  # After pod starts:
  #   bash /workspace/nanoseek/nanoseek/scaling_law_lab/setup_runpod.sh
  #   cd /workspace/nanoseek/nanoseek
  #   python -m nanoseek.scripts.run_phase3 --start-from 500m-transfer --stop-after day2

# ============================================================================
# Pod 3: NanoSeek-1B Full Training (Day 3)
# ============================================================================
# Cost: ~$316 for ~12 hours
# What runs: Full 1B training (22B tokens), scaling law fit, final report

pod3_1b:
  name: "nanoseek-day3-1b"
  gpu_type: "NVIDIA H100 80GB HBM3"
  gpu_count: 8
  cloud_type: "SECURE"               # MUST be secure for multi-GPU NVLink
  container_image: "runpod/pytorch:2.4.0-py3.11-cuda12.4.1-devel-ubuntu22.04"
  volume_id: "<nanoseek-data-volume-id>"    # SAME volume
  env: *shared_env

  # After pod starts:
  #   bash /workspace/nanoseek/nanoseek/scaling_law_lab/setup_runpod.sh
  #   cd /workspace/nanoseek/nanoseek
  #
  #   # For 8-GPU, use torchrun instead of the pipeline script:
  #   BEST_MLR=<from day1>  # check pipeline_state.json or W&B
  #   BEST_ELR=<from day1>
  #
  #   torchrun --nproc_per_node=8 -m nanoseek.scripts.pre_train \
  #       --run nanoseek-1b-v1 --scale 1b \
  #       --matrix-lr $BEST_MLR --embedding-lr $BEST_ELR \
  #       --device-batch-size 16 --eval-every 500 --save-every 2000 --seed 42
  #
  #   # After training, fit scaling law:
  #   python -m nanoseek.scripts.analyze_ablations --full-report --output results/phase3_results.json

# ============================================================================
# Cost Summary
# ============================================================================
#
# | Pod | GPU | Hours | $/hr | Total |
# |-----|-----|-------|------|-------|
# | Day 1 | 1× RTX 4090 | ~2 | $0.44 | ~$1 |
# | Day 2 | 1× H100 | ~14 | $3.29 | ~$46 |
# | Day 3 | 8× H100 | ~12 | $26.32 | ~$316 |
# | TOTAL | | | | ~$365 |
#
# + Network volume: ~$0.07/GB/month × 200GB = ~$14/month
#
# Budget ceiling: $600 (from TRAINING_PLAN_PHASE3.md)
# Expected spend: ~$377 (including volume + buffer)
#
# ============================================================================
